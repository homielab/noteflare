name: CI

# Runs on release tags; release.yml waits for this run on the tagged commit before it publishes.
# Release tags only (Boss 2026-11-21: no CI on push to main).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Only the tests whose failure loses notes or locks people out; the full suite
      # (`bun run test`) runs locally before a release. See CONTRIBUTING.md.
      - run: bun run test:critical
      - run: bun run build
      - run: bun run build:client
